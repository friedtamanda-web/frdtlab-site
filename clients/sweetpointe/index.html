<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client Proposal · FRDT Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --blue: #1a73e8; --pink: #e8388a; --ink: #17222e; --gray: #5b6672; --navy: #0F2438; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: #F6F8FB; line-height: 1.55; }
  h1, h2, h3, .gate-card h1 { font-family: 'Manrope', system-ui, sans-serif; }

  /* ---------- GATE ---------- */
  #gate { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--navy); }
  .gate-card { width: min(420px, 90vw); text-align: center; padding: 40px 20px; }
  .gate-brand { font-size: 12px; font-weight: 600; letter-spacing: 5px; color: rgba(255,255,255,0.45); margin-bottom: 30px; }
  .gate-brand .lab { color: var(--blue); }
  .gate-card h1 { color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }
  .gate-rule { width: 48px; height: 3px; background: var(--pink); border-radius: 2px; margin: 0 auto 18px auto; }
  .gate-card p { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 26px; }
  .gate-card input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; font-family: 'Inter', sans-serif; }
  .gate-card input:focus { border-color: var(--blue); }
  .gate-card button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--blue); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Manrope', sans-serif; }
  .gate-card button:hover { background: #1765cc; }
  #gate-err { color: #ff7b8a; font-size: 13px; margin-top: 14px; display: none; }

  /* ---------- CONTENT ---------- */
  #content { display: none; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 44px 28px 60px 28px; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
  .brandmark { font-size: 12px; font-weight: 600; letter-spacing: 4px; color: var(--gray); }
  .brandmark .lab { color: var(--blue); }
  .prepared { font-size: 13px; color: var(--gray); }
  .kicker { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); margin-bottom: 12px; }
  h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; margin-bottom: 14px; color: var(--navy); }
  .sub { color: var(--gray); font-size: 17px; max-width: 640px; margin-bottom: 18px; }
  .accent-bar { width: 56px; height: 3px; background: var(--pink); border-radius: 2px; margin-bottom: 28px; }
  .callout { border-left: 4px solid var(--blue); background: #fff; padding: 18px 22px; margin-bottom: 26px; border-radius: 0 14px 14px 0; font-size: 14.5px; box-shadow: 0 2px 12px rgba(15,36,56,0.05); }
  .callout b { display: block; margin-bottom: 3px; font-family: 'Manrope', sans-serif; font-weight: 700; }
  .hero { background: #fff; border: 1px solid #E4EAF1; border-radius: 20px; padding: 30px 32px; margin-bottom: 22px; box-shadow: 0 4px 22px rgba(15,36,56,0.07); position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--blue), var(--pink)); }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .badge { background: #EAF2FD; color: var(--blue); font-size: 11px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; }
  .price { text-align: right; }
  .price .big { font-family: 'Manrope', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -1px; color: var(--navy); }
  .price .base { color: var(--gray); font-size: 13px; }
  .price .under { font-size: 12px; color: var(--gray); }
  .hero h2 { font-size: 20px; margin-bottom: 10px; }
  .hero-note { font-size: 14px; color: var(--gray); margin-bottom: 16px; }
  .cols, .outcols { display: flex; gap: 28px; flex-wrap: wrap; }
  .cols ul, .outcols ul { flex: 1 1 280px; list-style: none; }
  .cols li, .outcols li { padding-left: 16px; position: relative; margin-bottom: 8px; font-size: 14px; }
  .cols li::before { content: "▪"; color: var(--blue); position: absolute; left: 0; font-size: 11px; }
  .outcols li::before { content: "✓"; color: #34a853; position: absolute; left: 0; font-weight: bold; }
  .cta-band { background: var(--navy); color: #fff; border-radius: 20px; padding: 34px 28px; text-align: center; margin-bottom: 30px; }
  .cta-copy b { display: block; font-family: 'Manrope', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
  .cta-copy span { display: block; font-size: 13.5px; opacity: 0.92; max-width: 560px; margin: 0 auto 18px auto; }
  .btn-primary { display: inline-block; background: var(--pink); color: #fff; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; padding: 15px 36px; border-radius: 12px; text-decoration: none; box-shadow: 0 4px 16px rgba(232,56,138,0.35); transition: transform 0.12s; }
  .btn-primary:hover { transform: translateY(-2px); }
  .cta-alt { margin-top: 16px; font-size: 13px; opacity: 0.85; }
  .cta-alt a { color: #fff; }
  .section-label { font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); margin: 30px 0 12px 0; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .step { background: #fff; border: 1px solid #E4EAF1; border-radius: 14px; padding: 15px 17px; font-size: 13px; box-shadow: 0 2px 10px rgba(15,36,56,0.04); }
  .step b { display: block; font-family: 'Manrope', sans-serif; color: var(--blue); font-weight: 800; margin-bottom: 4px; }
  .addons { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .addon { background: #fff; border: 1px solid #E4EAF1; border-radius: 14px; padding: 17px 19px; font-size: 13.5px; box-shadow: 0 2px 10px rgba(15,36,56,0.04); }
  .addon b { display: block; font-family: 'Manrope', sans-serif; font-weight: 700; margin-bottom: 5px; color: var(--navy); }
  .addon span { color: var(--gray); }
  .outcols { background: #fff; border: 1px solid #E4EAF1; border-radius: 20px; padding: 24px 26px 14px 26px; box-shadow: 0 2px 12px rgba(15,36,56,0.05); position: relative; overflow: hidden; }
  .outbox { position: relative; }
  .outbox .outcols::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #34a853; }
  .fine { background: #EBEFF4; border-radius: 12px; padding: 15px 19px; font-size: 12.5px; color: #47525e; margin-top: 24px; }
  .cta-final { text-align: center; margin: 34px 0 10px 0; }
  .footy { text-align: center; font-size: 11px; color: #9aa5b1; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 36px; }
</style>
</head>

</div>

const SALT = "phRv/bLqPaXRcNalbaAqwg==";
const IV = "WXXQUNITLx1UA1JI";

function b64ToBuf(b64) { const s = atob(b64); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b.buffer; }

async function unlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('gate-err');
  err.style.display = 'none';
  try {
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBuf(SALT), iterations: 310000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(IV) }, key, b64ToBuf(PAYLOAD));
    document.getElementById('content').innerHTML = new TextDecoder().decode(plain);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.body.style.background = '#f6f8fb';
  } catch (e) {
    err.style.display = 'block';
  }
}
