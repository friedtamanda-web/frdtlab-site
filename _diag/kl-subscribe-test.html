<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Klaviyo subscribe test</title></head>
<body style="font-family:system-ui,sans-serif;padding:16px;max-width:720px">
<h1>Klaviyo subscribe test (internal)</h1>
<p>Runs the list sign-up call three ways and prints Klaviyo's answer. Nothing runs until you press the button.</p>
<input id="em" type="email" placeholder="email" style="width:100%;padding:8px" aria-label="Email">
<button id="go" style="margin-top:8px;padding:8px 14px">Run test</button>
<pre id="out" style="white-space:pre-wrap;background:#f3f3f3;padding:12px;margin-top:12px"></pre>
<script>
function body(email,withSource){var a={profile:{data:{type:'profile',attributes:{email:email,subscriptions:{email:{marketing:{consent:'SUBSCRIBED'}}}}}}};if(withSource)a.custom_source='Diag test';return JSON.stringify({data:{type:'subscription',attributes:a,relationships:{list:{data:{type:'list',id:'QYJzYY'}}}}});}
var tests=[
 {name:'A current form (vnd.api+json, custom_source)',url:'https://a.klaviyo.com/client/subscriptions?company_id=Twvzce',ct:'application/vnd.api+json',src:true},
 {name:'B no custom_source',url:'https://a.klaviyo.com/client/subscriptions?company_id=Twvzce',ct:'application/vnd.api+json',src:false},
 {name:'C scorecard style (application/json, trailing slash)',url:'https://a.klaviyo.com/client/subscriptions/?company_id=Twvzce',ct:'application/json',src:false}
];
document.getElementById('go').onclick=async function(){
 var em=document.getElementById('em').value.trim(), out=document.getElementById('out'); out.textContent='';
 if(!em){out.textContent='Enter an email first.';return;}
 for(var t of tests){
  try{var r=await fetch(t.url,{method:'POST',headers:{'Content-Type':t.ct,'revision':'2024-10-15'},body:body(em,t.src)});
   var txt=await r.text(); out.textContent+=t.name+' -> HTTP '+r.status+' '+(txt||'(empty body)')+'\n\n';}
  catch(e){out.textContent+=t.name+' -> NETWORK ERROR '+e.name+': '+e.message+'\n\n';}
 }
 out.textContent+='done';
};
</script></body></html>
