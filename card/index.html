<title>Amanda Friedt | Growth Systems</title>
<style>
:root{color-scheme:light;--ink:#102a2a;--paper:#f5f1e8;--accent:#de7657;--muted:#687775}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#e9e7df;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(100%,620px);min-height:370px;background:var(--paper);border-radius:24px;padding:clamp(28px,7vw,56px);position:relative;overflow:hidden;box-shadow:0 24px 80px #102a2a24;display:flex;flex-direction:column;justify-content:space-between}
.card:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#de76571c;right:-84px;top:-104px}.eyebrow{position:relative;font-size:11px;letter-spacing:.18em;font-weight:750;color:var(--accent);text-transform:uppercase}.name{position:relative;margin:48px 0 8px;font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(40px,9vw,62px);line-height:.98;letter-spacing:-.045em}.descriptor{position:relative;margin:0;max-width:420px;font-size:clamp(17px,3vw,21px);line-height:1.45;color:#36504e}.rule{height:1px;background:#102a2a20;margin:32px 0 20px}.bottom{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.email{color:var(--ink);font-size:14px;text-decoration:none;font-weight:650}.email:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}.actions{display:flex;gap:10px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:999px;font-size:12px;font-weight:700;text-decoration:none}.primary{background:var(--ink);color:white}.secondary{border:1px solid #102a2a35;color:var(--ink)}.footer{position:relative;margin-top:28px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media(max-width:440px){.card{min-height:400px}.bottom{align-items:flex-start;flex-direction:column}.actions{width:100%}.button{flex:1}}
</style>
<script type="text/javascript" src="https://s.skimresources.com/js/313384X1802103.skimlinks.js"></script>
</head>
<body>
<main class="card" aria-label="Digital business card for Amanda Friedt">
  <div>
    <div class="eyebrow">Marketing systems · Revenue growth</div>
    <h1 class="name">Amanda<br>Friedt</h1>
    <p class="descriptor">Building the operating system for autonomous growth.</p>
  </div>
  <div>
    <div class="rule"></div>
    <div class="bottom">
      <a class="email" href="mailto:hello@frdtlab.com">hello@frdtlab.com</a>
      <div class="actions">
        <a class="button primary" href="mailto:hello@frdtlab.com?subject=Let%E2%80%99s%20connect">Email Amanda</a>
        <a class="button secondary" href="Amanda-Friedt.vcf">Save contact</a>
      </div>
    </div>
    <div class="footer"><a href="https://frdtlab.com/">FRDTLAB</a> · <a href="https://www.linkedin.com/in/amandafriedt/">LinkedIn</a> · <a href="/marketing-machine/">Explore the course</a></div>
  </div>
</main>
</body>
</html>
